<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 하늘과 노을의 깊은 그라데이션 -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="35%" stop-color="#1c2541" />
      <stop offset="65%" stop-color="#5c2c5c" />
      <stop offset="85%" stop-color="#cf455c" />
      <stop offset="100%" stop-color="#ff7b54" />
    </linearGradient>
    
    <!-- 이글거리는 태양 그라데이션 -->
    <radialGradient id="sunGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="25%" stop-color="#ffcc00" />
      <stop offset="65%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#cc0044" />
    </radialGradient>

    <!-- 구름을 밝히는 역광 그라데이션 -->
    <linearGradient id="cloudEdgeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- 구름 내부 어두운 면 그라데이션 -->
    <linearGradient id="cloudBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311d4d" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#160c26" stop-opacity="0.95" />
    </linearGradient>

    <!-- 산맥의 깊이에 따른 3가지 그라데이션 -->
    <linearGradient id="mountFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c2c72" />
      <stop offset="100%" stop-color="#211235" />
    </linearGradient>
    <linearGradient id="mountMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e184a" />
      <stop offset="100%" stop-color="#120621" />
    </linearGradient>
    <linearGradient id="mountNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#160829" />
      <stop offset="100%" stop-color="#05010a" />
    </linearGradient>

    <!-- 물의 깊고 어두운 그라데이션 -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190d33" />
      <stop offset="50%" stop-color="#0c051c" />
      <stop offset="100%" stop-color="#020005" />
    </linearGradient>

    <!-- 수면에 반사되는 윤슬의 황금빛 빛무리 -->
    <linearGradient id="yoonseulGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0" />
      <stop offset="25%" stop-color="#ffcc00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#ffcc00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
    </linearGradient>

    <!-- 엠블럼 마스킹 원 -->
    <clipPath id="emblemClip">
      <circle cx="400" cy="400" r="360" />
    </clipPath>
  </defs>

  <!-- 테두리 빛나는 황금빛 링 -->
  <circle cx="400" cy="400" r="364" fill="none" stroke="url(#sunGrad)" stroke-width="8" opacity="0.95" />
  
  <g clip-path="url(#emblemClip)">
    <!-- 하늘 배경 -->
    <rect width="800" height="800" fill="url(#skyGrad)" />
    
    <!-- 지평선에 잠기는 태양 -->
    <circle cx="400" cy="430" r="170" fill="url(#sunGrad)" />

    <!-- 구름 역광 (태양 뒤에서 퍼져 나오는 빛무리) -->
    <path d="M 200,320 Q 300,260 420,290 T 640,300 Q 700,340 600,380 H 200 Z" fill="url(#cloudEdgeGrad)" opacity="0.3" filter="blur(12px)" />

    <!-- 먼 산 (Far Mountains) -->
    <path d="M 0,520 L 150,440 L 290,490 L 460,390 L 620,470 L 800,410 L 800,560 L 0,560 Z" fill="url(#mountFar)" opacity="0.9" />

    <!-- 빛나는 구름 데코 (태양 앞을 부드럽게 스쳐 지나가는 구름) -->
    <!-- 구름 그림자 몸체 -->
    <path d="M 120,380 C 170,330 250,330 290,360 C 340,310 440,310 490,350 C 530,320 610,330 650,370 C 690,410 630,460 570,440 C 490,460 410,430 360,450 C 290,440 160,440 120,380 Z" fill="url(#cloudBodyGrad)" />
    <!-- 구름 테두리 하이라이트 (태양빛에 반사되어 하얗게 빛나는 라인) -->
    <path d="M 120,380 C 170,330 250,330 290,360 C 340,310 440,310 490,350 C 530,320 610,330 650,370" fill="none" stroke="url(#cloudEdgeGrad)" stroke-width="4" stroke-linecap="round" opacity="0.9" />

    <!-- 중간 산 (Mid Mountains) -->
    <path d="M -50,560 L 180,460 L 340,520 L 510,430 L 690,510 L 850,440 L 850,600 L -50,600 Z" fill="url(#mountMid)" />

    <!-- 가까운 산 (Near Mountains) -->
    <path d="M -20,600 L 120,510 L 260,560 L 420,470 L 600,550 L 820,480 L 820,620 L -20,620 Z" fill="url(#mountNear)" />

    <!-- 바다 / 물 수면 -->
    <rect y="540" width="800" height="260" fill="url(#waterGrad)" />

    <!-- 물결 선 (수평 질감) -->
    <path d="M 50,555 Q 220,548 400,555 T 750,555" fill="none" stroke="#cf455c" stroke-width="2" opacity="0.5" />
    <path d="M 100,580 Q 250,572 400,580 T 700,580" fill="none" stroke="#cf455c" stroke-width="1.8" opacity="0.4" />
    <path d="M 150,610 Q 280,602 400,610 T 650,610" fill="none" stroke="#cf455c" stroke-width="1.5" opacity="0.3" />
    <path d="M 180,645 Q 300,637 400,645 T 620,645" fill="none" stroke="#ff7b54" stroke-width="1.2" opacity="0.25" />
    <path d="M 220,685 Q 310,677 400,685 T 580,685" fill="none" stroke="#ff7b54" stroke-width="1" opacity="0.2" />
    <path d="M 260,730 Q 330,723 400,730 T 540,730" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.15" />

    <!-- 윤슬 (Yoonseul) 그라데이션 빛무리 반사 -->
    <ellipse cx="400" cy="558" rx="160" ry="10" fill="url(#yoonseulGrad)" />
    <ellipse cx="400" cy="583" rx="130" ry="8" fill="url(#yoonseulGrad)" />
    <ellipse cx="400" cy="613" rx="100" ry="7" fill="url(#yoonseulGrad)" />
    <ellipse cx="400" cy="648" rx="80" ry="6" fill="url(#yoonseulGrad)" />
    <ellipse cx="400" cy="688" rx="60" ry="5" fill="url(#yoonseulGrad)" />
    <ellipse cx="400" cy="733" rx="40" ry="4" fill="url(#yoonseulGrad)" />
    <ellipse cx="400" cy="775" rx="20" ry="3" fill="url(#yoonseulGrad)" />

    <!-- 반짝이는 세부 다이아몬드 윤슬 입자 -->
    <path d="M 400,550 L 406,556 L 400,562 L 394,556 Z" fill="#ffffff" />
    <path d="M 350,565 L 354,569 L 350,573 L 346,569 Z" fill="#ffcc00" opacity="0.9" />
    <path d="M 450,567 L 454,571 L 450,575 L 446,571 Z" fill="#ffcc00" opacity="0.9" />
    <path d="M 380,590 L 385,595 L 380,600 L 375,595 Z" fill="#ffffff" />
    <path d="M 420,592 L 425,597 L 420,602 L 415,597 Z" fill="#ffffff" />
    <path d="M 330,605 L 333,608 L 330,611 L 327,608 Z" fill="#ffcc00" opacity="0.7" />
    <path d="M 470,603 L 473,606 L 470,609 L 467,606 Z" fill="#ffcc00" opacity="0.7" />
    <path d="M 395,625 L 400,630 L 395,635 L 390,630 Z" fill="#ffffff" />
    <path d="M 410,655 L 414,659 L 410,663 L 406,659 Z" fill="#ffcc00" opacity="0.85" />
    <path d="M 370,665 L 373,668 L 370,671 L 367,668 Z" fill="#ffcc00" opacity="0.6" />
    <path d="M 402,705 L 405,708 L 402,711 L 399,708 Z" fill="#ffffff" opacity="0.75" />
  </g>
</svg>
